services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: gtasks-tailscale
    labels:
      - com.centurylinklabs.watchtower.scope=gtasks-mcp
    hostname: gtasks-mcp
    environment:
      - TS_AUTHKEY=${TS_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      - TS_SERVE_CONFIG=/config/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
      - ./tailscale-serve.json:/config/serve.json:ro
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    restart: unless-stopped

  gtasks-mcp:
    build: .
    container_name: gtasks-mcp
    labels:
      - com.centurylinklabs.watchtower.scope=gtasks-mcp
    network_mode: service:tailscale
    depends_on:
      - tailscale
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped

  watchtower:
    image: containrrr/watchtower
    container_name: gtasks-watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_SCOPE=gtasks-mcp
      - WATCHTOWER_SCHEDULE=0 0 3 * * *
      - DOCKER_API_VERSION=1.40
    restart: unless-stopped

volumes:
  tailscale-state:
